name: Build and deploy NukeWatch

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.geojson'
      - '*.py'
      - '.github/workflows/site.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nukewatch-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Assemble uploaded source files into the required layout
        run: |
          mkdir -p _build/collector _build/assets
          cp index.html _build/index.html
          cp style.css app.js countries.geojson _build/assets/
          cp run.py config.py sources.py _build/collector/
          touch _build/collector/__init__.py _build/.nojekyll
          python -m compileall -q _build/collector
          node --check _build/assets/app.js
      - name: Render a complete keyless world map
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('_build/assets/app.js')
          js = path.read_text()
          start = js.index('  L.tileLayer(')
          end = js.index('  var groups =', start)
          js = js[:start] + "  map.createPane('worldBase');\n  map.getPane('worldBase').style.zIndex = '350';\n" + js[end:]
          assert 'minZoom: 1.5' in js
          js = js.replace('minZoom: 1.5', 'minZoom: 0', 1)
          needle = '    countriesGeo = g;'
          assert js.count(needle) == 1
          replacement = '''    countriesGeo = g;
              L.geoJSON(g, {
                pane: 'worldBase',
                style: { color: '#58616e', weight: 0.7, fillColor: '#1b222c', fillOpacity: 1 },
                onEachFeature: function (ft, layer) {
                  var label = document.createElement('span');
                  label.textContent = ft.properties.name || 'Country';
                  layer.bindTooltip(label, { sticky: true });
                }
              }).addTo(map);
              map.fitBounds([[-85, -180], [85, 180]], { padding: [12, 12] });'''
          js = js.replace(needle, replacement, 1)
          assert 'L.tileLayer(' not in js
          path.write_text(js)
          page = Path('_build/index.html')
          page.write_text(page.read_text().replace('Map © OpenStreetMap contributors © CARTO.', 'Map rendered from bundled country boundaries.'))
          PY
          node --check _build/assets/app.js
      - name: Restore collection history
        uses: actions/cache/restore@v4
        with:
          path: _build/data
          key: nukewatch-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nukewatch-data-
      - name: Collect live data (never publish test fixtures)
        working-directory: _build
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python -m collector.run
      - name: Validate published files
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('_build')
          html = (root / 'index.html').read_text()
          for ref in re.findall(r'(?:src|href)="([^"]+)"', html):
              if not ref.startswith(('http:', 'https:', '#')):
                  assert (root / ref).is_file(), f'Missing page dependency: {ref}'
          world = json.loads((root / 'assets/countries.geojson').read_text())
          assert len(world['features']) >= 177
          data = json.loads((root / 'data/latest.json').read_text())
          assert all(k in data for k in ('updated', 'score', 'flashpoints', 'aircraft', 'summary'))
          assert 0 <= data['score'] <= 100
          print('Asset paths, world boundaries, and dashboard JSON passed validation.')
          print('Source availability:', data.get('errors', {}))
          PY
      - name: Preserve baseline history for the next scan
        uses: actions/cache/save@v4
        with:
          path: _build/data
          key: nukewatch-data-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package only public website files
        run: rm -rf _build/collector
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
